<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyberpunk Cosmic Safety Guide</title>
    <style>
        :root {
            --neon-pink: #ff2a74;
            --neon-blue: #00f0ff;
            --neon-purple: #9d4edd;
            --neon-orange: #ff6b35;
            --space-dark: #0a0915;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* Prevents iPhone from rubber-banding/shaking while panning */
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--space-dark);
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
        }

        /* 360 Sphere/Sky Container */
        #sky-viewport {
            position: absolute;
            width: 100%;
            height: 100%;
            perspective: 800px;
            overflow: hidden;
            cursor: grab;
        }

        #sky-viewport:active {
            cursor: grabbing;
        }

        /* The actual canvas wrapping the space elements */
        #space-horizon {
            position: absolute;
            width: 300%;
            height: 300%;
            top: -100%;
            left: -100%;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        /* Calm Background Neon Grid Overlay */
        .cyber-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
            background-size: 60px 60px;
            background-position: center;
            transform: translateZ(-200px);
            pointer-events: none;
        }

        /* Ambient Cosmic Background Elements */
        .ambient-svg {
            position: absolute;
            pointer-events: none;
            opacity: 0.25;
            filter: drop-shadow(0 0 8px var(--neon-purple));
            animation: drift 25s infinite linear;
        }

        /* Interactive Guide Node */
        #guide-constellation {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .guide-star {
            width: 90px;
            height: 90px;
            cursor: pointer;
            filter: drop-shadow(0 0 15px var(--neon-pink));
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: pulse 2s infinite ease-in-out;
            -webkit-tap-highlight-color: transparent;
        }

        .guide-star:hover {
            transform: scale(1.15);
        }

        /* Interface Overlay HUD */
        #hud-panel {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 500px;
            background: rgba(10, 9, 21, 0.88);
            border: 1px solid var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            z-index: 20;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            pointer-events: auto;
        }

        .hud-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--neon-blue);
            margin-bottom: 8px;
            font-weight: bold;
        }

        .hud-text {
            font-size: 14px;
            line-height: 1.5;
            color: #e0e0ff;
            min-height: 85px;
        }

        .hud-instruction {
            font-size: 10px;
            color: #64648c;
            margin-top: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Connected Safety Ring Visual Container */
        #safety-matrix {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 5;
        }

        .safety-ring-line {
            stroke: var(--neon-orange);
            stroke-width: 2.5;
            stroke-dasharray: 8 4;
            animation: dash 30s linear infinite;
            filter: drop-shadow(0 0 12px var(--neon-orange));
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }

        /* Audio Control Button overlay */
        #audio-toggle-indicator {
            position: absolute;
            top: 55px;
            width: 100%;
            text-align: center;
            font-size: 9px;
            letter-spacing: 1px;
            color: var(--neon-blue);
            opacity: 0.6;
            pointer-events: none;
            text-transform: uppercase;
        }

        /* Animations */
        @keyframes pulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 12px var(--neon-pink)); }
            50% { transform: scale(1.06); filter: drop-shadow(0 0 25px var(--neon-pink)); }
        }

        @keyframes drift {
            0% { transform: rotate(0deg) translate(0, 0) scale(1); }
            50% { transform: rotate(180deg) translate(15px, -30px) scale(1.05); }
            100% { transform: rotate(360deg) translate(0, 0) scale(1); }
        }

        @keyframes dash {
            to { stroke-dashoffset: -1000; }
        }

        /* Utility hints for navigation */
        .interaction-hint {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            font-size: 11px;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.4);
            pointer-events: none;
            z-index: 25;
        }
    </style>
</head>
<body>

    <div class="interaction-hint">← SWIPE TO PAN 360° SKY →</div>
    <div id="audio-toggle-indicator">Audio will automatically activate upon first interaction</div>

    <div id="sky-viewport">
        <div id="space-horizon">
            <!-- Calm Cyber Grid Backplane -->
            <div class="cyber-grid"></div>
            
            <!-- Dynamic Neon SVGs populate here via JS -->
            <div id="ambient-layer"></div>

            <!-- Dynamic SVG layer for safety ring connection links -->
            <svg id="safety-matrix" width="100%" height="100%"></svg>

            <!-- Interactive Constellation Centerpoint -->
            <div id="guide-constellation">
                <!-- Glowing Cosmic Star Guide -->
                <svg class="guide-star" viewBox="0 0 24 24" fill="none" onclick="advanceGuide()">
                    <polygon points="12,2 15,9 22,9 17,14 19,21 12,17 5,21 7,14 2,9 9,9" fill="#ff2a74" />
                    <circle cx="12" cy="12" r="3" fill="#ffffff"/>
                </svg>
            </div>
        </div>
    </div>

    <!-- HUD Text Display Panel -->
    <div id="hud-panel">
        <div class="hud-title" id="step-title">System Calibrating</div>
        <div class="hud-text" id="step-desc">Breathe in. The flashing codes are just a temporary reflection. Your true data lives safely deeper down. Click the central pink guide star to sync your mind.</div>
        <div class="hud-instruction" id="step-action">TAP THE FLOATING GUIDE STAR TO ADVANCE</div>
    </div>

    <script>
        // Immersive Guide Text Sequences
        const guideSteps = [
            {
                title: "01 // Anchoring Your Focus",
                desc: "Take a slow, deep breath. A software interface failure can make everything look broken or lost, but your actual code creations remain protected in cold storage databases.",
                color: "#ff2a74"
            },
            {
                title: "02 // Breaking The Local Loop",
                desc: "The duplicate timelines on your screen are just an application cache loop. Your work isn't overwritten—the site is simply projecting the same frozen frame.",
                color: "#00f0ff"
            },
            {
                title: "03 // Initializing Google Takeout",
                desc: "When your phone space allows, navigating directly to ://google.com will compile and pull your real, raw chronological text data without using the broken sidebar app interface.",
                color: "#9d4edd"
            },
            {
                title: "04 // Connecting the Matrix",
                desc: "Let the interface rollbacks do their work on Google's network architecture over the next 24 hours. Your core files remain safely indexed away from local system limits.",
                color: "#ffbb00"
            },
            {
                title: "05 // Orange Rabbit Safety Ring",
                desc: "The loop breaks. The constellation locks. Your workspace data parameters are safe, structural, and secure. Grounding complete.",
                color: "#ff6b35"
            }
        ];

        let currentStep = 0;
        const horizon = document.getElementById('space-horizon');
        const ambientLayer = document.getElementById('ambient-layer');
        const safetyMatrix = document.getElementById('safety-matrix');
        const starPolygon = document.querySelector('.guide-star polygon');
        
        // 360 Axis Tracking Engine States
        let isDragging = false;
        let rotX = 0, rotY = 0;
        let lastX = 0, lastY = 0;

Use code with caution.// Web Audio API Synthesizer Core Contextlet audioCtx = null;let ambientDrone = null;let ambientGain = null;function initAudio() {if (audioCtx) return; // Prevent double initialization// Create Audio Architecture context wrapperaudioCtx = new (window.AudioContext || window.webkitAudioContext)();// 1. Build Calming Background Space DroneambientGain = audioCtx.createGain();ambientGain.gain.setValueAtTime(0.08, audioCtx.currentTime); // Soft background mix level// Base carrier oscillator oscillatorconst osc1 = audioCtx.createOscillator();osc1.type = 'sawtooth';osc1.frequency.setValueAtTime(55, audioCtx.currentTime); // Low A note// Modulating secondary oscillator to simulate a rich analog filter sweepconst osc2 = audioCtx.createOscillator();osc2.type = 'triangle';osc2.frequency.setValueAtTime(55.5, audioCtx.currentTime); // Detuned for warmth// Low pass filter to remove harsh edge and maximize soothing low-end frequenciesconst filter = audioCtx.createBiquadFilter();filter.type = 'lowpass';filter.frequency.setValueAtTime(180, audioCtx.currentTime);// Connect synthesizer network componentsosc1.connect(filter);osc2.connect(filter);filter.connect(ambientGain);ambientGain.connect(audioCtx.destination);osc1.start();osc2.start();document.getElementById('audio-toggle-indicator').innerText = "AUDIO MODE: ENGINE SYNCHRONIZED";document.getElementById('audio-toggle-indicator').style.color = "var(--neon-pink)";}// Play an ethereal glowing bell tone synthesized instantly on clickfunction playChime(frequency) {if (!audioCtx) return;if (audioCtx.state === 'suspended') {audioCtx.resume();}const now = audioCtx.currentTime;// Sound envelope architecture nodesconst chimeGain = audioCtx.createGain();chimeGain.gain.setValueAtTime(0, now);chimeGain.gain.linearRampToValueAtTime(0.25, now + 0.02); // Snappy attackchimeGain.gain.exponentialRampToValueAtTime(0.001, now + 2.5); // long fading feedback reverb tailconst osc = audioCtx.createOscillator();osc.type = 'sine';osc.frequency.setValueAtTime(frequency, now);// Harmonically complex secondary sine overtone for magical textureconst overtone = audioCtx.createOscillator();overtone.type = 'sine';overtone.frequency.setValueAtTime(frequency * 1.5, now);const chimeFilter = audioCtx.createBiquadFilter();chimeFilter.type = 'lowpass';chimeFilter.frequency.setValueAtTime(1200, now);osc.connect(chimeFilter);overtone.connect(chimeFilter);chimeFilter.connect(chimeGain);chimeGain.connect(audioCtx.destination);osc.start(now);overtone.start(now);osc.stop(now + 2.6);overtone.stop(now + 2.6);}const viewport = document.getElementById('sky-viewport');// Desktop Mouse Event Core Setupviewport.addEventListener('mousedown', (e) => {initAudio();isDragging = true;lastX = e.clientX;lastY = e.clientY;});window.addEventListener('mouseup', () => isDragging = false);window.addEventListener('mousemove', (e) => {if (!isDragging) return;const deltaX = e.clientX - lastX;const deltaY = e.clientY - lastY;rotY += deltaX * 0.15;rotX -= deltaY * 0.15;lastX = e.clientX;lastY = e.clientY;horizon.style.transform = rotateX(${rotX}deg) rotateY(${rotY}deg) ;});// Fixed Smartphone Mobile Touch Control Core Setupviewport.addEventListener('touchstart', (e) => {initAudio();isDragging = true;lastX = e.touches[0].clientX;lastY = e.touches[0].clientY;}, { passive: true });window.addEventListener('touchend', () => isDragging = false);window.addEventListener('touchmove', (e) => {if (!isDragging) return;// Target the raw index coordinates of the touch point surfaceconst deltaX = e.touches[0].clientX - lastX;const deltaY = e.touches[0].clientY - lastY;rotY += deltaX * 0.25; // Balanced sensitivity for mobile viewport pansrotX -= deltaY * 0.25;// Lock tracking parameterslastX = e.touches[0].clientX;lastY = e.touches[0].clientY;horizon.style.transform = rotateX(${rotX}deg) rotateY(${rotY}deg);}, { passive: true });// Generate vector cyber shapes (Bunnies, Moons, Cross Stars)const assets = [<path d="M10,30 Q5,15 12,5 Q18,5 18,22 Q23,5 30,5 Q35,15 30,30 Q35,45 35,55 Q35,65 20,65 Q5,65 5,55 Q5,45 10,30 Z" fill="none" stroke="currentColor" stroke-width="1.5"/>,<path d="M10,5 A25,25 0 1,0 45,40 A20,20 0 1,1 10,5 Z" fill="none" stroke="currentColor" stroke-width="1.5"/>,<path d="M25,0 L25,50 M0,25 L50,25 M15,15 L35,35 M15,35 L35,15" fill="none" stroke="currentColor" stroke-width="1"/>];function populateCosmos() {const count = 26;const colors = ['var(--neon-pink)', 'var(--neon-blue)', 'var(--neon-purple)', 'var(--neon-orange)'];for(let i=0; i<count; i++) {const svg = document.createElementNS("w3.org", "svg");svg.setAttribute('class', 'ambient-svg');svg.setAttribute('viewBox', '0 0 60 70');svg.style.width = ${Math.random() * 35 + 20}px;svg.style.height = auto;svg.style.left = ${Math.random() * 260 + 20}%;svg.style.top = ${Math.random() * 260 + 20}%;svg.style.color = colors[Math.floor(Math.random() * colors.length)];svg.innerHTML = assets[Math.floor(Math.random() * assets.length)];svg.style.animationDelay = ${Math.random() * -30}s;svg.style.animationDuration = ${Math.random() * 20 + 20}s;ambientLayer.appendChild(svg);}}// Logic progression system milestones tracking to output ring configurationfunction advanceGuide() {initAudio(); // Backup layer verification for locked user tap statescurrentStep++;if(currentStep >= guideSteps.length) {currentStep = 0;clearSafetyRing();}const activeData = guideSteps[currentStep];document.getElementById('step-title').innerText = activeData.title;document.getElementById('step-desc').innerText = activeData.desc;document.querySelector('.guide-star').style.filter = drop-shadow(0 0 20px ${activeData.color});starPolygon.setAttribute('fill', activeData.color);// Dynamically scale pitch tones upward as steps resolveconst scalePitches = [220, 277.18, 329.63, 440, 554.37];playChime(scalePitches[currentStep]);if(currentStep === guideSteps.length - 1) {renderSafetyRing();}}function renderSafetyRing() {safetyMatrix.innerHTML = '';const w = window.innerWidth * 3;const h = window.innerHeight * 3;safetyMatrix.setAttribute('viewBox', 0 0 ${w} ${h});const nodes = 12;const centerX = w / 2;const centerY = h / 2;const radius = 240;let pointsStr = [];for(let i=0; i<=nodes; i++) {let angle = (i / nodes) * 2 * Math.PI;let x = centerX + radius * Math.cos(angle);let y = centerY + radius * Math.sin(angle);pointsStr.push({x, y});}let polyline = document.createElementNS("w3.org", "polyline");let pathData = pointsStr.map(p => ${p.x},${p.y}).join(' ');polyline.setAttribute('points', pathData);polyline.setAttribute('class', 'safety-ring-line');polyline.style.opacity = '1';safetyMatrix.appendChild(polyline);document.getElementById('step-action').innerText = "PROTECTIVE MATRIX SECURED // TAP TO RESTART";document.getElementById('step-action').style.color = "var(--neon-orange)";// Play a triumphant dual synth major chord cluster upon securing the matrixsetTimeout(() => { playChime(440); }, 100);setTimeout(() => { playChime(554.37); }, 250);setTimeout(() => { playChime(659.25); }, 400);}function clearSafetyRing() {safetyMatrix.innerHTML = '';document.getElementById('step-action').innerText = "TAP THE FLOATING GUIDE STAR TO ADVANCE";document.getElementById('step-action').style.color = "#64648c";}populateCosmos();
